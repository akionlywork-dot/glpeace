<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社員応募 | 株式会社がんばりピース</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="sub-page">
  <header>
    <div class="logo">がんばりピース</div>
    <details class="site-menu">
      <summary class="menu-toggle" aria-label="メニュー">
        <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>MENU</span>
      </summary>
      <nav class="menu-panel" aria-label="サイトメニュー">
        <a href="index.html">トップ</a>
        <a href="index.html#company-info">会社情報</a>
        <a href="index.html#recruit-info">採用情報</a>
        <a href="news-detail.html">News</a>
        <a href="contact.html">お問い合わせ</a>
      </nav>
    </details>
  </header>

  <div class="page-title">
    <h2>社員募集</h2>
  </div>

  <main class="page">
    <section id="contact">
      <form id="contact-form">
  <input type="hidden" name="_subject" value="【社員応募】新しい応募が届きました">

  <label for="job">応募する職種</label>
  <select id="job" name="job" data-fs-field required>
    <option value="">選んでください</option>
    <option>ピース応援スタッフ</option>
    <option>✌ポーズ指導員</option>
    <option>資本金管理係</option>
    <option>対抗会社「smilehappy」監視員</option>
    <option>お問い合わせ返信係</option>
    <option>社訓暗唱リーダー</option>
    <option>社長見守り係</option>
  </select>
  <span data-fs-error="job"></span>

  <label for="name">お名前</label>
  <input id="name" name="name" type="text" autocomplete="name" data-fs-field required>
  <span data-fs-error="name"></span>

  <label for="email">メールアドレス</label>
  <input id="email" name="email" type="email" autocomplete="email" data-fs-field required>
  <span data-fs-error="email"></span>

  <label for="message">志望動機</label>
  <textarea id="message" name="message" rows="5" data-fs-field required></textarea>
  <span data-fs-error="message"></span>

  <p id="error" data-fs-error role="alert"></p>
  <button type="submit" data-fs-submit-btn>応募する</button>
</form>
      <p id="thanks" data-fs-success aria-live="polite">お問い合わせありがとうございます。</p>
    </section>
  </main>

  <footer>
    <p>© 2026 株式会社がんばりピース</p>
  </footer>

<script>
  const params = new URLSearchParams(location.search);
  const job = params.get("job");
  if (job) document.getElementById("job").value = job;
</script>

  <script src="contact.js"></script>
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
  <script src="script.js"></script>
</body>
</html>
