  <link rel="stylesheet" href="style.css">
</head>
<body class="sub-page">
  <header>
    <div class="logo">がんばりピース</div>
    <details class="site-menu">
      <summary class="menu-toggle" aria-label="メニュー">
        <span class="menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>MENU</span>
      </summary>
      <nav class="menu-panel" aria-label="サイトメニュー">

  </header>

  <div class="page-title">
    <h2>お問い合わせ</h2>
  </div>

  <main class="page">
    <section id="contact">
      <form id="contact-form">
        <label for="name">お名前</label>
        <input id="name" name="name" type="text" autocomplete="name" data-fs-field required>
        <span data-fs-error="name"></span>

        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" autocomplete="email" data-fs-field required>
        <span data-fs-error="email"></span>

        <label for="message">内容</label>
        <textarea id="message" name="message" rows="5" data-fs-field required></textarea>
        <span data-fs-error="message"></span>

        <p id="error" data-fs-error role="alert"></p>
        <button type="submit" data-fs-submit-btn>送信</button>
      </form>
      <p id="thanks" data-fs-success aria-live="polite">お問い合わせありがとうございます。</p>
    </section>
  </main>

  <footer>
    <p>© 2026 株式会社がんばりピース</p>
  </footer>

  <script src="contact.js"></script>
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
